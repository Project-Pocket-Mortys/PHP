<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(\.git|\.research|docs|tools|tests)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(pocket_mortys\.sql|compose\.research\.yaml)$">
    Require all denied
</FilesMatch>
# Do not log query strings containing SSE tokens.
LogFormat "%h %t %m %U %>s %b %D" research
# Emulator-only connectivity probe and asset-origin substitution. The source
# manifest and public deployment routes remain untouched.
Redirect 204 /_research/online
<LocationMatch "^/Aliases/[^/]+/[^/]+/manifest\.json$">
    SetOutputFilter SUBSTITUTE
    Substitute "s|https://assets.conspiracyrick.com|http://127.0.0.1:8087|n"
</LocationMatch>
