name: pocket-mortys-research
services:
  db:
    image: mariadb:10.11@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: pocket_mortys
      MARIADB_USER: pocket
      MARIADB_PASSWORD: research-only
      MARIADB_ROOT_PASSWORD: research-root-only
    volumes:
      - research-db:/var/lib/mysql
      - ./pocket_mortys.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: ./tools/research/server
    ports:
      - "127.0.0.1:8087:80"
    environment:
      PM_DB_HOST: db
      PM_DB_NAME: pocket_mortys
      PM_DB_USER: pocket
      PM_DB_PASS: research-only
      PM_LOGIN_MAINTENANCE: "0"
      PM_PUBLIC_ORIGIN: http://localhost:8087
    volumes:
      - .:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
  udp:
    profiles: [udp]
    build: ./tools/research/server
    command: [php, /var/www/html/tools/research/server/udp-relay.php]
    ports:
      - "127.0.0.1:5055:5055/udp"
    environment:
      PM_DB_HOST: db
      PM_DB_NAME: pocket_mortys
      PM_DB_USER: pocket
      PM_DB_PASS: research-only
      PM_RESEARCH_UDP: "1"
    volumes:
      - .:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  research-db:
